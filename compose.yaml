name: plain-chat
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: chat_demo
      POSTGRES_PASSWORD: demo_database_only
      POSTGRES_DB: chat_demo
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_demo -d chat_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:9000:4566"]
    volumes: ["storage_data:/var/lib/localstack"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: plain-chat-app:local
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &backend
      DATABASE_URL: postgresql://chat_demo:demo_database_only@postgres:5432/chat_demo
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
      API_PORT: 4000
      COOKIE_SECURE: "false"
      SESSION_DAYS: 7
      S3_ENDPOINT: http://storage:4566
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: chat-demo
      S3_ACCESS_KEY: demo_storage
      S3_SECRET_KEY: demo_storage_only
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    image: plain-chat-app:local
    build: .
    command: ["npx", "tsx", "prisma/seed.ts"]
    environment: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
  api:
    image: plain-chat-app:local
    build: .
    command: ["node", "dist/server/index.js"]
    environment: *backend
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      seed: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    image: plain-chat-app:local
    build:
      context: .
      args: {NEXT_PUBLIC_API_URL: "http://localhost:4000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
  storage_data:
